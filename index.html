  <style>
    html, body {
      height: 100%;
      overscroll-behavior: none;
      background: #e5e5e5;
    }
    body { font-family: 'Source Sans 3', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5d5; border-radius: 3px; }
    *:focus-visible {
      outline: 2.5px solid #0ecabc;
      outline-offset: 2px;
      border-radius: 6px;
    }
    [data-tela] {
      animation: telaIn 0.28s ease-out both;
    }
    @keyframes telaIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ativo {
      color: #0ecabc;
    }
    .ativo svg { fill: #0ecabc; }
    .nav-btn { color: #9ca3af; transition: color 0.2s, transform 0.15s; }
    .nav-btn:active { transform: scale(0.9); }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 30px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translate(-50%, 0); }
      to   { opacity: 0; transform: translate(-50%, 30px); }
    }
    .toast-ok    { background: #0d9a9b; }
    .toast-erro  { background: #dc2626; }
    .toast-info  { background: #374151; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 50px; font-size: 0.75rem;
      font-weight: 600; letter-spacing: 0.01em;
    }
    .badge-ok    { background: #d1faf5; color: #0d7c7c; }
    .badge-aviso { background: #fef3c7; color: #b45309; }
    .badge-info  { background: #dbeafe; color: #1e40af; }
    .card {
      background: #fff; border-radius: 18px;
      box-shadow: 0 2px 16px rgba(13,80,80,0.07);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover { box-shadow: 0 8px 30px rgba(13,80,80,0.12); }
    .card:active { transform: scale(0.985); }
    .card-click { cursor: pointer; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 12px 24px; border-radius: 50px; font-weight: 600;
      font-family: 'Outfit', sans-serif; font-size: 0.95rem;
      border: none; cursor: pointer; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #0ecabc; color: #fff; }
    .btn-primary:hover { background: #0d9a9b; }
    .btn-accent { background: #f9882e; color: #fff; }
    .btn-accent:hover { background: #e8711e; }
    .btn-outline {
      background: transparent; color: #0d6262;
      border: 2px solid #0ecabc;
    }
    .btn-outline:hover { background: #effefb; }
    .btn-ghost {
      background: transparent; color: #0d6262; padding: 8px 14px;
    }
    .btn-ghost:hover { background: #f3f4f4; }
    .input-field {
      width: 100%; padding: 13px 16px; border: 2px solid #e5e7eb;
      border-radius: 14px; font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem; background: #fff; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      outline: none; border-color: #0ecabc;
      box-shadow: 0 0 0 4px rgba(14,202,188,0.12);
    }
    .swipe-indicator {
      width: 40px; height: 4px; border-radius: 2px;
      background: #d1d5db; margin: 0 auto 12px;
    }
    .avatar-circle {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 700; font-family: 'Outfit', sans-serif;
      color: #fff; flex-shrink: 0; user-select: none;
    }
    .star { color: #fbbf24; }
  </style>
</head>

const LOC_MAP={centro:"Centro","zona-sul":"Zona Sul","zona-norte":"Zona Norte","zona-leste":"Zona Leste","zona-oeste":"Zona Oeste",abc:"Grande SP"};

let catAtiva="todas";
let buscaAtual="";
let filtroLocal=null;
let filtroPrecoMax=500;
let filtroDisp=[];
let filtrosAtivos=0;

function catalogo_de_servicos_estrelas(nota){
  const cheias=Math.floor(nota);
  const meia=nota%1>=0.5?1:0;
  const vazias=5-cheias-meia;
  let s='';
  for(let i=0;i<cheias;i++) s+='<svg class="w-3.5 h-3.5 text-amber-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
  if(meia) s+='<svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 20 20"><defs><linearGradient id="hg"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="#D1D5DB"/></linearGradient></defs><path fill="url(#hg)" stroke="currentColor" stroke-width="0.5" d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
  for(let i=0;i<vazias;i++) s+='<svg class="w-3.5 h-3.5 text-gray-200 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
  return s;
}

function catalogo_de_servicos_verDisp(disp){
  if(disp.includes("hoje")) return {texto:"Hoje",classe:"bg-green-100 text-green-700"};
  if(disp.includes("amanha")) return {texto:"Amanhã",classe:"bg-blue-100 text-blue-700"};
  return {texto:"Fim de semana",classe:"bg-amber-100 text-amber-700"};
}

function catalogo_de_servicos_selFiltro(btn,tipo,val){
  if(tipo==="local"){
    document.querySelectorAll(".filtro-local").forEach(b=>{b.classList.remove("bg-marca-600","text-white","border-marca-600");b.classList.add("border-gray-200","text-gray-700")});
    if(filtroLocal===val){filtroLocal=null;btn.classList.remove("bg-marca-600","text-white","border-marca-600");btn.classList.add("border-gray-200","text-gray-700")}
    else{filtroLocal=val;btn.classList.add("bg-marca-600","text-white","border-marca-600");btn.classList.remove("border-gray-200","text-gray-700")}
  }
}

function catalogo_de_servicos_atualizaPreco(v){
  document.getElementById("preco-range-label").textContent="R$ 0 — "+brl(Number(v));
}

function catalogo_de_servicos_abrirFiltros(){
  const m=document.getElementById("modal-filtros");m.classList.remove("hidden");
  requestAnimationFrame(()=>{document.getElementById("modal-filtros-painel").classList.remove("translate-y-full")});
}

function catalogo_de_servicos_fecharFiltros(){
  document.getElementById("modal-filtros-painel").classList.add("translate-y-full");
  setTimeout(()=>{document.getElementById("modal-filtros").classList.add("hidden")},300);
}

function catalogo_de_servicos_aplicarFiltros(){
  const precoInput=document.getElementById("cat-preco-max");
  filtroPrecoMax=Number(precoInput.value);
  filtroDisp=[...document.querySelectorAll(".filtro-disp:checked")].map(c=>c.value);
  filtrosAtivos=(filtroLocal?1:0)+(filtroPrecoMax<500?1:0)+(filtroDisp.length>0?1:0);
  if(filtrosAtivos>0){document.getElementById("contador-filtros").textContent="Filtros ("+filtrosAtivos+")";document.getElementById("btn-filtro-contador").classList.add("ring-2","ring-marca-300","ring-offset-1")}
  else{document.getElementById("contador-filtros").textContent="Filtros";document.getElementById("btn-filtro-contador").classList.remove("ring-2","ring-marca-300","ring-offset-1")}
  catalogo_de_servicos_render();
  toast("Filtros aplicados","ok");
}

function catalogo_de_servicos_limparFiltros(){
  filtroLocal=null;filtroPrecoMax=500;filtroDisp=[];filtrosAtivos=0;
  document.getElementById("cat-preco-max").value=500;document.getElementById("preco-range-label").textContent="R$ 0 — "+brl(500);
  document.querySelectorAll(".filtro-local").forEach(b=>{b.classList.remove("bg-marca-600","text-white","border-marca-600");b.classList.add("border-gray-200","text-gray-700")});
  document.querySelectorAll(".filtro-disp").forEach(c=>c.checked=false);
  document.getElementById("contador-filtros").textContent="Filtros";
  document.getElementById("btn-filtro-contador").classList.remove("ring-2","ring-marca-300","ring-offset-1");
  catalogo_de_servicos_render();
}

function catalogo_de_servicos_filtrados(){
  let r=[...PRESTADORES];
  if(catAtiva!=="todas") r=r.filter(p=>p.categoria===catAtiva);
  const b=buscaAtual.toLowerCase().trim();
  if(b) r=r.filter(p=>p.nome.toLowerCase().includes(b)||p.servico.toLowerCase().includes(b)||p.categoria.toLowerCase().includes(b)||p.local.toLowerCase().includes(b));
  if(filtroLocal) r=r.filter(p=>p.local===filtroLocal);
  if(filtroPrecoMax<500) r=r.filter(p=>p.preco<=filtroPrecoMax);
  if(filtroDisp.length>0) r=r.filter(p=>filtroDisp.some(d=>p.disp.includes(d)));
  return r;
}

function catalogo_de_servicos_card(p){
  const d=catalogo_de_servicos_verDisp(p.disp);
  const r=document.createElement("div");
  r.className="card bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden cursor-pointer hover:shadow-md active:scale-[0.98] transition-all duration-200";
  r.onclick=()=>catalogo_de_servicos_abrirDetalhe(p.id);
  const tags=p.categoria==="Limpeza"||p.categoria==="Dedetização"?"Ecológico":"Verificado";
  const tagCls=p.categoria==="Limpeza"||p.categoria==="Dedetização"?"bg-green-50 text-green-600":"bg-blue-50 text-blue-600";
  const localMap=LOC_MAP[p.local]||p.local;
  r.innerHTML='<div class="flex items-center gap-3 p-4"><div class="w-14 h-14 rounded-full '+CORES[p.cor]+' flex items-center justify-center text-white font-display font-bold text-lg flex-shrink-0">'+p.iniciais+'</div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><h3 class="font-display font-semibold text-gray-900 text-sm truncate">'+p.nome+'</h3><span class="'+tagCls+' text-[10px] font-semibold px-1.5 py-0.5 rounded-full flex-shrink-0">'+tags+'</span></div><p class="text-xs text-gray-500 mt-0.5">'+p.servico+'</p><div class="flex items-center gap-2 mt-1.5"><div class="flex items-center gap-0.5">'+catalogo_de_servicos_estrelas(p.nota)+'</div><span class="text-xs font-semibold text-gray-700">'+p.nota+'</span><span class="text-[10px] text-gray-400">('+p.avaliacoes+')</span></div></div><div class="text-right flex-shrink-0"><p class="font-display font-bold text-marca-600 text-sm">R$ '+p.preco+'</p><p class="text-[10px] text-gray-400">a partir de</p><span class="inline-block mt-1.5 px-2 py-0.5 rounded-full text-[10px] font-semibold '+d.classe+'">'+d.texto+'</span></div></div><div class="px-4 pb-3 flex items-center gap-2"><svg class="h-3.5 w-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243A8 8 0 1117.657 16.657z"/><circle cx="12" cy="11" r="1.5" fill="currentColor"/></svg><span class="text-xs text-gray-500 truncate">'+localMap+'</span></div>';
  return r;
}

function catalogo_de_servicos_avaliacaoHTML(p){
  const reviews=[
    {user:"Mariana S.",texto:"Excelente trabalho! Muito profissional e caprichosa. Recomendo muito!",nota:5,tempo:"há 2 dias"},
    {user:"João P.",texto:"Bom atendimento, chegou no horário e fez um serviço impecável.",nota:5,tempo:"há 1 semana"},
    {user:"Carla M.",texto:"Ótima experiência. Já contratei três vezes e sempre sai satisfeita.",nota:5,tempo:"há 2 semanas"}
  ];
  let h='<div class="space-y-3 max-h-48 overflow-y-auto pr-1">';
  reviews.forEach(rv=>{h+='<div class="bg-gray-50 rounded-xl p-3"><div class="flex items-center justify-between"><span class="text-sm font-semibold text-gray-800">'+rv.user+'</span><span class="text-[10px] text-gray-400">'+rv.tempo+'</span></div><div class="flex gap-0.5 mt-1">'+catalogo_de_servicos_estrelas(rv.nota)+'</div><p class="text-xs text-gray-600 mt-1.5 leading-relaxed">'+rv.texto+'</p></div>'});
  h+='</div>';
  return h;
}

function catalogo_de_servicos_abrirDetalhe(id){
  const p=PRESTADORES.find(x=>x.id===id);if(!p)return;
  const d=catalogo_de_servicos_verDisp(p.disp);
  const locMap=LOC_MAP[p.local]||p.local;
  abrirModal('<div class="space-y-4"><div class="flex items-center gap-4"><div class="w-16 h-16 rounded-full '+CORES[p.cor]+' flex items-center justify-center text-white font-display font-bold text-xl flex-shrink-0">'+p.iniciais+'</div><div><h3 class="font-display font-bold text-gray-900 text-lg leading-tight">'+p.nome+'</h3><p class="text-sm text-gray-500 mt-0.5">'+p.servico+'</p><div class="flex items-center gap-1.5 mt-1">'+catalogo_de_servicos_estrelas(p.nota)+'<span class="text-sm font-semibold text-gray-700">'+p.nota+'</span><span class="text-xs text-gray-400">('+p.avaliacoes+' avaliações)</span></div></div></div><div class="flex gap-2"><span class="px-3 py-1 '+CORES_BADGE[p.cor]+' text-xs font-semibold rounded-full">'+p.categoria+'</span><span class="px-3 py-1 bg-green-50 text-green-700 text-xs font-semibold rounded-full">Verificado</span><span class="px-3 py-1 '+d.classe+' text-xs font-semibold rounded-full">Disponível '+d.texto+'</span></div><div class="bg-gray-50 rounded-xl p-4"><h4 class="text-sm font-semibold text-gray-700 mb-1">Sobre</h4><p class="text-sm text-gray-600 leading-relaxed">'+p.bio+'</p></div><div class="grid grid-cols-2 gap-3"><div class="bg-marca-50 rounded-xl p-3 text-center"><svg class="h-5 w-5 text-marca-600 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p class="font-display font-bold text-marca-600 text-sm">'+brl(p.preco)+'</p><p class="text-[10px] text-gray-500">preço inicial</p></div><div class="bg-blue-50 rounded-xl p-3 text-center"><svg class="h-5 w-5 text-blue-600 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243A8 8 0 1117.657 16.657z"/></svg><p class="text-xs font-semibold text-blue-700 mt-1">'+locMap+'</p><p class="text-[10px] text-gray-500">localização</p></div></div><div><h4 class="text-sm font-semibold text-gray-700 mb-2">Avaliações</h4>'+catalogo_de_servicos_avaliacaoHTML(p)+'</div><div class="flex gap-3 pt-2"><button onclick="fecharModal();mostrarTela(\'solicitar-servico\');toast(\'Profissional selecionado: '+p.nome+'\',\'info\')" class="flex-1 py-3 bg-marca-600 text-white text-sm font-semibold rounded-xl hover:bg-marca-700 active:scale-95 transition">Solicitar orçamento</button><button onclick="fecharModal();toast(\'Abrindo chat com '+p.nome+'...\',\'info\')" class="px-4 py-3 border border-gray-200 text-gray-600 rounded-xl hover:bg-gray-50 active:scale-95 transition"><svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></button></div></div>',p.nome);
}

function catalogo_de_servicos_render(){
  const lista=document.getElementById("cat-lista");
  const vazio=document.getElementById("cat-vazio");
  const cont=document.getElementById("cat-contador-resultados");
  const resultados=catalogo_de_servicos_filtrados();
  lista.innerHTML="";
  if(resultados.length===0){lista.classList.add("hidden");vazio.classList.remove("hidden");cont.textContent="";return}
  lista.classList.remove("hidden");vazio.classList.add("hidden");
  cont.textContent=resultados.length+" profissional"+(resultados.length!==1?"s":"")+" encontrado"+(resultados.length!==1?"s":"");
  resultados.forEach(p=>lista.appendChild(catalogo_de_servicos_card(p)));
}

function catalogo_de_servicos_buscar(v){buscaAtual=v;catalogo_de_servicos_render()}

function catalogo_de_servicos_init(){
  const catContainer=document.getElementById("cat-categorias");
  CATEGORIAS.forEach(cat=>{
    const btn=document.createElement("button");
    btn.className="cat-btn flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all duration-200 border";
    btn.dataset.cat=cat.id;
    if(cat.id==="todas"){btn.classList.add("bg-marca-600","text-white","border-marca-600","shadow-sm")}
    else{btn.classList.add("bg-white","text-gray-600","border-gray-200","hover:border-marca-300","hover:text-marca-600","active:scale-95")}
    btn.innerHTML=cat.icone+cat.label;
    btn.onclick=()=>{
      catAtiva=cat.id;
      document.querySelectorAll(".cat-btn").forEach(b=>{b.classList.remove("bg-marca-600","text-white","border-marca-600","shadow-sm");b.classList.add("bg-white","text-gray-600","border-gray-200","hover:border-marca-300","hover:text-marca-600")});
      btn.classList.add("bg-marca-600","text-white","border-marca-600","shadow-sm");btn.classList.remove("bg-white","text-gray-600","border-gray-200","hover:border-marca-300","hover:text-marca-600");
      catalogo_de_servicos_render();
    };
    catContainer.appendChild(btn);
  });
  catalogo_de_servicos_render();
}

window._catalogoInit=catalogo_de_servicos_init;
})();

    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm max-h-[80vh] flex flex-col overflow-hidden z-10">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h3 id="modal-titulo" class="font-display font-bold text-lg text-marca-950"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors" aria-label="Fechar">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-conteudo" class="overflow-y-auto p-5"></div>
      <div id="modal-acoes" class="px-5 py-4 border-t border-gray-100 flex gap-3 justify-end"></div>
    </div>
  </div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', function() {
      mostrarTela('catalogo-de-servicos');
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    });

    function toast(mensagem, tipo) {
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      var labels = { ok: '✓', erro: '✕', info: 'ℹ' };
      t.className = 'toast-' + tipo + ' pointer-events-auto px-5 py-3 rounded-pill text-white text-sm font-semibold shadow-lg flex items-center gap-2 whitespace-nowrap';
      t.style.animation = 'toastIn 0.3s ease-out';
      t.innerHTML = '<span>' + labels[tipo] + '</span> ' + mensagem;
      c.appendChild(t);
      setTimeout(function() {
        t.style.animation = 'toastOut 0.3s ease-in forwards';
        t.addEventListener('animationend', function() { t.remove(); });
      }, 3000);
    }

    function abrirModal(html, titulo) {
      var m = document.getElementById('modal');
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-acoes').innerHTML = '';
      m.classList.remove('hidden');
      m.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      var m = document.getElementById('modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      var d = new Date(iso + 'T03:00:00');
      return d.toLocaleDateString('pt-BR');
    }

    function avatarNome(nome, tam, cor) {
      tam = tam || 44;
      cor = cor || '#0d9a9b';
      var iniciais = nome.split(' ').map(function(p){ return p[0]; }).join('').substring(0,2).toUpperCase();
      return '<div class="avatar-circle" style="width:'+tam+'px;height:'+tam+'px;background:'+cor+';font-size:'+(tam*0.38)+'px">'+iniciais+'</div>';
    }
    function renderStars(n) {
      var s = '';
      for (var i = 1; i <= 5; i++) {
        s += i <= n ? '<span class="star text-lg leading-none">★</span>' : '<span class="text-gray-300 text-lg leading-none">★</span>';
      }
      return s;
    }
  </script>
</body>
</html>
