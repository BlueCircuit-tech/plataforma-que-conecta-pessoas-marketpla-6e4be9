<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ConectaPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#effefb', 100: '#c8fef6', 200: '#97fded',
              300: '#54f5e3', 400: '#1be7d1', 500: '#0ecabc',
              600: '#0d9a9b', 700: '#0e7c7c', 800: '#0f6262',
              900: '#0d5050', 950: '#003334',
            },
            destaque: {
              50: '#fff7ed', 100: '#ffeedf', 200: '#fedbb3',
              300: '#fdc580', 400: '#fba44f', 500: '#f9882e',
              600: '#e8711e', 700: '#c05518', 800: '#9a451b',
              900: '#7d3b1b',
            },
          },
          fontFamily: {
            display: ['Outfit', 'system-ui', 'sans-serif'],
            body: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            card: '0 2px 16px rgba(13,80,80,0.07)',
            cardUp: '0 8px 30px rgba(13,80,80,0.12)',
            nav: '0 -2px 20px rgba(0,0,0,0.06)',
            float: '0 4px 20px rgba(249,136,46,0.35)',
          },
          borderRadius: {
            app: '32px',
            card: '18px',
            pill: '50px',
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      height: 100%;
      overscroll-behavior: none;
      background: #e5e5e5;
    }
    body { font-family: 'Source Sans 3', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5d5; border-radius: 3px; }
    *:focus-visible {
      outline: 2.5px solid #0ecabc;
      outline-offset: 2px;
      border-radius: 6px;
    }
    [data-tela] {
      animation: telaIn 0.28s ease-out both;
    }
    @keyframes telaIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ativo {
      color: #0ecabc;
    }
    .ativo svg { fill: #0ecabc; }
    .nav-btn { color: #9ca3af; transition: color 0.2s, transform 0.15s; }
    .nav-btn:active { transform: scale(0.9); }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 30px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translate(-50%, 0); }
      to   { opacity: 0; transform: translate(-50%, 30px); }
    }
    .toast-ok    { background: #0d9a9b; }
    .toast-erro  { background: #dc2626; }
    .toast-info  { background: #374151; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 50px; font-size: 0.75rem;
      font-weight: 600; letter-spacing: 0.01em;
    }
    .badge-ok    { background: #d1faf5; color: #0d7c7c; }
    .badge-aviso { background: #fef3c7; color: #b45309; }
    .badge-info  { background: #dbeafe; color: #1e40af; }
    .card {
      background: #fff; border-radius: 18px;
      box-shadow: 0 2px 16px rgba(13,80,80,0.07);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover { box-shadow: 0 8px 30px rgba(13,80,80,0.12); }
    .card:active { transform: scale(0.985); }
    .card-click { cursor: pointer; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 12px 24px; border-radius: 50px; font-weight: 600;
      font-family: 'Outfit', sans-serif; font-size: 0.95rem;
      border: none; cursor: pointer; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #0ecabc; color: #fff; }
    .btn-primary:hover { background: #0d9a9b; }
    .btn-accent { background: #f9882e; color: #fff; }
    .btn-accent:hover { background: #e8711e; }
    .btn-outline {
      background: transparent; color: #0d6262;
      border: 2px solid #0ecabc;
    }
    .btn-outline:hover { background: #effefb; }
    .btn-ghost {
      background: transparent; color: #0d6262; padding: 8px 14px;
    }
    .btn-ghost:hover { background: #f3f4f4; }
    .input-field {
      width: 100%; padding: 13px 16px; border: 2px solid #e5e7eb;
      border-radius: 14px; font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem; background: #fff; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      outline: none; border-color: #0ecabc;
      box-shadow: 0 0 0 4px rgba(14,202,188,0.12);
    }
    .swipe-indicator {
      width: 40px; height: 4px; border-radius: 2px;
      background: #d1d5db; margin: 0 auto 12px;
    }
    .avatar-circle {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 700; font-family: 'Outfit', sans-serif;
      color: #fff; flex-shrink: 0; user-select: none;
    }
    .star { color: #fbbf24; }
  </style>
</head>
<body class="bg-neutral-300 min-h-screen flex items-center justify-center p-0 sm:p-4">

  <div id="app-frame" class="w-full h-screen sm:h-[844px] sm:w-[390px] bg-white sm:rounded-app overflow-hidden relative flex flex-col shadow-2xl">

    <div class="hidden sm:flex items-center justify-between px-8 py-2 bg-white text-xs font-body text-neutral-800 select-none flex-shrink-0">
      <span id="clock" class="font-semibold tabular-nums">9:41</span>
      <div class="flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3C7.46 3 3.34 4.78.29 7.67l1.57 1.56C5.04 6.55 8.36 5.25 12 5.25s6.96 1.3 10.14 3.98L22.71 7.67C19.66 4.78 15.54 3 12 3zM12 9.5c-1.66 0-3.17.54-4.36 1.44L7.24 11.5h9.52l-.4-.56C15.17 10.04 13.66 9.5 12 9.5zm-5 4c1.66 0 3.17.54 4.36 1.44L7.24 15.5h9.52l-.4-.56C15.17 14.04 13.66 13.5 12 13.5zm5 5c-1.66 0-3.17.54-4.36 1.44l-.4.56h9.52l-.4-.56C17.17 19.04 15.66 18.5 14 18.5z"/></svg>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg class="w-6 h-4" fill="currentColor" viewBox="0 0 24 16"><rect x="0" y="6" width="20" height="10" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="2" y="8" width="16" height="6" rx="1" fill="currentColor"/><rect x="21" y="8" width="3" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </div>
    </div>

    <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden bg-neutral-100 relative">

      <!-- TELAS -->

    </main>

    <nav id="bottom-nav" class="flex-shrink-0 bg-white shadow-nav flex items-center justify-around px-2 pb-2 pt-1.5 sm:rounded-b-app relative z-50">
      <button data-nav="catalogo-de-servicos" onclick="mostrarTela('catalogo-de-servicos')" class="nav-btn ativo flex flex-col items-center gap-0.5 p-1.5 min-w-[56px]" aria-label="Catálogo de Serviços">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="text-[0.65rem] font-semibold leading-none">Explorar</span>
      </button>
      <button data-nav="solicitar-servico" onclick="mostrarTela('solicitar-servico')" class="nav-btn flex flex-col items-center gap-0.5 p-1.5 min-w-[56px]" aria-label="Solicitar Serviço">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span class="text-[0.65rem] font-semibold leading-none">Solicitar</span>
      </button>
      <button data-nav="acompanhar-pedido" onclick="mostrarTela('acompanhar-pedido')" class="nav-btn flex flex-col items-center gap-0.5 p-1.5 min-w-[56px]" aria-label="Acompanhar Pedido">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="text-[0.65rem] font-semibold leading-none">Pedidos</span>
      </button>
      <button data-nav="minha-conta-prestador" onclick="mostrarTela('minha-conta-prestador')" class="nav-btn flex flex-col items-center gap-0.5 p-1.5 min-w-[56px]" aria-label="Minha Conta">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[0.65rem] font-semibold leading-none">Conta</span>
      </button>
    </nav>
  </div>

  <div id="toast-container" class="fixed bottom-20 left-1/2 z-[9999] flex flex-col gap-2 pointer-events-none" style="transform:translateX(-50%)"></div>

  <div id="modal" class="fixed inset-0 z-[9998 hidden items-center justify-center p-4">
    <div id="modal-fundo" class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="fecharModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm max-h-[80vh] flex flex-col overflow-hidden z-10">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h3 id="modal-titulo" class="font-display font-bold text-lg text-marca-950"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors" aria-label="Fechar">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-conteudo" class="overflow-y-auto p-5"></div>
      <div id="modal-acoes" class="px-5 py-4 border-t border-gray-100 flex gap-3 justify-end"></div>
    </div>
  </div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', function() {
      mostrarTela('catalogo-de-servicos');
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    });

    function toast(mensagem, tipo) {
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      var labels = { ok: '✓', erro: '✕', info: 'ℹ' };
      t.className = 'toast-' + tipo + ' pointer-events-auto px-5 py-3 rounded-pill text-white text-sm font-semibold shadow-lg flex items-center gap-2 whitespace-nowrap';
      t.style.animation = 'toastIn 0.3s ease-out';
      t.innerHTML = '<span>' + labels[tipo] + '</span> ' + mensagem;
      c.appendChild(t);
      setTimeout(function() {
        t.style.animation = 'toastOut 0.3s ease-in forwards';
        t.addEventListener('animationend', function() { t.remove(); });
      }, 3000);
    }

    function abrirModal(html, titulo) {
      var m = document.getElementById('modal');
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-acoes').innerHTML = '';
      m.classList.remove('hidden');
      m.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      var m = document.getElementById('modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      var d = new Date(iso + 'T03:00:00');
      return d.toLocaleDateString('pt-BR');
    }

    function avatarNome(nome, tam, cor) {
      tam = tam || 44;
      cor = cor || '#0d9a9b';
      var iniciais = nome.split(' ').map(function(p){ return p[0]; }).join('').substring(0,2).toUpperCase();
      return '<div class="avatar-circle" style="width:'+tam+'px;height:'+tam+'px;background:'+cor+';font-size:'+(tam*0.38)+'px">'+iniciais+'</div>';
    }
    function renderStars(n) {
      var s = '';
      for (var i = 1; i <= 5; i++) {
        s += i <= n ? '<span class="star text-lg leading-none">★</span>' : '<span class="text-gray-300 text-lg leading-none">★</span>';
      }
      return s;
    }
  </script>
</body>
</html>
